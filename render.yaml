services:
  - type: web
    name: docsguide-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: nepali-docs-hybrid
      - key: ALLOWED_ORIGINS
        sync: false
